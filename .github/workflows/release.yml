name: Publish Release
on:
  push:
    branches: [release]
jobs:
  publish-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          MANIFEST_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json')).version")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Package and manifest versions must match." >&2
            exit 1
          fi
          mkdir -p artifacts
          (cd dist && zip -qr "../artifacts/dwb-$VERSION-chrome.zip" .)
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes "DeepWiki Bookmarker for Chrome. Extract the ZIP and load its folder from chrome://extensions in Developer mode."
          fi
          gh release upload "v$VERSION" artifacts/*.zip --clobber
